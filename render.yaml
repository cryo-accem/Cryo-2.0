services:
  - type: web
    name: cryo-accem
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 2 --threads 4 --timeout 180 --preload
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      # Aiven CA certificate for verified MySQL TLS. Set ONE of these:
      # MYSQL_SSL_CA_PEM = contents of Aiven's ca.pem; MYSQL_SSL_CA = file path.
      - key: MYSQL_SSL_CA_PEM
        sync: false
      - key: MYSQL_SSL_CA
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: convenor
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: cryoem.iisc@gmail.com
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: SECURE_COOKIES
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: CHARGE_SHEET_CC_EMAIL
        sync: false
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: GOOGLE_APPS_SCRIPT_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        value: cryo-accem/Cryo-2.0
      - key: GITHUB_BRANCH
        value: main
  # Render cron schedules are UTC: 04:30 UTC = 10:00 IST; 11:30 UTC = 17:00 IST;
  # 22:00 UTC = 03:30 IST.
  - type: cron
    name: cryo-freezing-slot-day-reminders
    runtime: python
    schedule: "30 4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python freezing_reminders.py --when slot_day
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_SSL_CA_PEM
        sync: false
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: GOOGLE_APPS_SCRIPT_TOKEN
        sync: false
      - key: FREEZING_REMINDER_EMAIL
        value: cryoem.iisc@gmail.com
  - type: cron
    name: cryo-freezing-day-before-reminders
    runtime: python
    schedule: "30 11 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python freezing_reminders.py --when day_before
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_SSL_CA_PEM
        sync: false
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: GOOGLE_APPS_SCRIPT_TOKEN
        sync: false
      - key: FREEZING_REMINDER_EMAIL
        value: cryoem.iisc@gmail.com
  - type: cron
    name: cryo-site-stats-refresh
    runtime: python
    schedule: "0 22 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python refresh_site_stats.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_SSL_CA_PEM
        sync: false
